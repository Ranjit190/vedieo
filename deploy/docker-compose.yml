services:
  media-server:
    build: ../server
    network_mode: host
    restart: unless-stopped
    environment:
      PORT: 4000
      ANNOUNCED_IP: ${ANNOUNCED_IP}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      RTC_MIN_PORT: ${RTC_MIN_PORT:-40000}
      RTC_MAX_PORT: ${RTC_MAX_PORT:-40100}
      NUM_WORKERS: ${NUM_WORKERS:-2}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2
    network_mode: host
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  caddy-data:
  caddy-config:
